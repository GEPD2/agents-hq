<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel unavailable - AGENTS-HQ</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0d0d0d; color: #e8e8ea; padding: 24px;
      font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
    }
    .card {
      width: 420px; max-width: 100%; text-align: center;
      background: #141414; border: 1px solid #262626; border-radius: 12px; padding: 28px;
    }
    .mark {
      width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 7px;
      background: linear-gradient(135deg, #8b5cf6, #a78bfa);
      display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700;
    }
    h1 { font-size: 16px; margin: 0 0 8px; }
    p { font-size: 12px; color: #a1a1aa; line-height: 1.6; margin: 0; }
    code { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">AH</div>
    <h1>Control panel unavailable</h1>
    <p>The AGENTS-HQ app is not responding behind the proxy. Check that the website
    container is running: <code>docker compose ps</code>, then <code>docker compose up -d website</code>.</p>
  </div>
</body>
</html>
