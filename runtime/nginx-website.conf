# TLS reverse proxy for the AGENTS-HQ control panel.
# Terminates HTTPS on loopback and forwards to the FastAPI app on 127.0.0.1:8080.
# The app stays loopback-only; this is the only TLS listener.
# Place at: runtime/nginx-website.conf  (mounted into the website-tls container)

server {
    listen 127.0.0.1:8443 ssl;
    server_name localhost 127.0.0.1;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Branded page for when the app itself is down.
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE log/stream endpoints need buffering off and a long read timeout.
        proxy_set_header Connection '';
        chunked_transfer_encoding on;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }
}
